<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | default: "PocketSurvey Enterprise | Mobile Surveying & Asset Management" }}</title>

    <!-- Crisp Minimalist Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Utility & Framework CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles/main.css">

    <!-- CloudCannon Visual Editor Support -->
    <link rel="stylesheet" href="/.cloudcannon/css/editor.css" />

    {% include 'partials/seo.html' %}

    <style>
      :root {
        --ps-navy: #0F172A;
        --ps-slate: #475569;
        --ps-light-bg: #F8FAFC;
        --ps-blue: #2563EB;
        --ps-blue-hover: #1D4ED8;
        --ps-border: #CBD5E1;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ps-navy);
        background-color: #FFFFFF;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Inter', sans-serif;
        letter-spacing: -0.02em;
      }
      .ps-badge {
        background: rgba(37, 99, 235, 0.2);
        color: #60A5FA;
        border: 1px solid rgba(96, 165, 250, 0.3);
        font-size: 0.65rem;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        letter-spacing: 0.8px;
      }
      .ps-btn-primary {
        background-color: var(--ps-blue) !important;
        color: #FFFFFF !important;
        font-weight: 600;
        border-radius: 6px;
        transition: background-color 0.15s ease;
      }
      .ps-btn-primary:hover {
        background-color: var(--ps-blue-hover) !important;
      }
      .ps-btn-outline {
        border: 1px solid var(--ps-border) !important;
        color: var(--ps-navy) !important;
        background-color: #FFFFFF !important;
        font-weight: 600;
        border-radius: 6px;
      }
      .ps-btn-outline:hover {
        background-color: var(--ps-light-bg) !important;
      }

      /* Header Custom Overrides - Bypassing W3.CSS */
      .ps-top-link {
        color: #94A3B8 !important;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.15s ease;
      }
      .ps-top-link:hover {
        color: #FFFFFF !important;
      }
      .ps-nav-link {
        color: #F1F5F9 !important;
        background: transparent !important;
        border: none !important;
        padding: 8px 16px !important;
        font-size: 0.95rem !important;
        font-weight: 600 !important;
        text-decoration: none !important;
        cursor: pointer;
        border-radius: 6px;
        transition: color 0.15s ease, background-color 0.15s ease;
      }
      .ps-nav-link:hover {
        color: #FFFFFF !important;
        background-color: rgba(255, 255, 255, 0.08) !important;
      }
      .ps-header-cta {
        background-color: #2563EB !important;
        color: #FFFFFF !important;
        font-weight: 600 !important;
        font-size: 0.95rem !important;
        padding: 9px 20px !important;
        border-radius: 6px !important;
        text-decoration: none !important;
        margin-left: 12px;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        transition: background-color 0.15s ease;
      }
      .ps-header-cta:hover {
        background-color: #1D4ED8 !important;
      }
      
      /* Pure CSS Dropdown Logic */
      .ps-dropdown {
        position: relative;
        display: inline-block;
      }
      .ps-dropdown-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 290px;
        background-color: #1E293B;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 8px 0;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
        z-index: 10000;
      }
      .ps-dropdown:hover .ps-dropdown-menu {
        display: block;
      }
      .ps-dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .ps-dropdown-item:hover {
        background-color: rgba(255, 255, 255, 0.08) !important;
      }
    </style>
  </head>
  <body>

    {% include 'partials/navigation/header.html' %}

    <main id="main" style="position: relative; z-index: 1;">
      {{ content }}
    </main>

    {% include 'partials/navigation/footer.html' %}

    <script>
      if (window.inEditorMode) {
        import("/register-components.js").catch((error) => {
          console.warn("Failed to load CloudCannon component registration:", error);
        });
      }
    </script>
  </body>
</html>
