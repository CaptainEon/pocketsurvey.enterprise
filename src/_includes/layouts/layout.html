<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | default: "PocketSurvey Enterprise | Mobile Surveying & Asset Management" }}</title>

    <!-- Crisp Minimalist Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Utility & Framework CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles/main.css">

    <!-- CloudCannon Visual Editor Support -->
    <link rel="stylesheet" href="/.cloudcannon/css/editor.css" />

    {% include 'partials/seo.html' %}

    <style>
      :root {
        --ps-navy: #0F172A;
        --ps-slate: #475569;
        --ps-light-bg: #F8FAFC;
        --ps-blue: #2563EB;
        --ps-blue-hover: #1D4ED8;
        --ps-border: #E2E8F0;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ps-navy);
        background-color: #FFFFFF;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Inter', sans-serif;
        letter-spacing: -0.02em;
      }
      .ps-badge {
        background: #EFF6FF;
        color: var(--ps-blue);
        border: 1px solid #BFDBFE;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        margin-left: 8px;
      }
      .ps-btn-primary {
        background-color: var(--ps-blue) !important;
        color: #FFFFFF !important;
        font-weight: 600;
        border-radius: 6px;
        transition: background-color 0.15s ease;
      }
      .ps-btn-primary:hover {
        background-color: var(--ps-blue-hover) !important;
      }
      .ps-btn-outline {
        border: 1px solid var(--ps-border) !important;
        color: var(--ps-navy) !important;
        background-color: #FFFFFF !important;
        font-weight: 600;
        border-radius: 6px;
      }
      .ps-btn-outline:hover {
        background-color: var(--ps-light-bg) !important;
       .ps-btn-outline:hover {
        background-color: var(--ps-light-bg) !important;
      }

      /* Dropdown Hover State Fix */
      .w3-dropdown-content a.w3-button:hover {
        background-color: rgba(255, 255, 255, 0.08) !important;
      }
    </style> 
      }
    </style>
  </head>
  <body>

    {% include 'partials/navigation/header.html' %}

<main id="main" style="position: relative; z-index: 1;">
      {{ content }}
    </main>

    {% include 'partials/navigation/footer.html' %}

    <script>
      if (window.inEditorMode) {
        import("/register-components.js").catch((error) => {
          console.warn("Failed to load CloudCannon component registration:", error);
        });
      }
    </script>
  </body>
</html>
