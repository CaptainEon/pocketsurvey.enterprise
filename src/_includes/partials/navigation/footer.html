<footer style="background-color: #09090B; color: #A1A1AA; border-top: 1px solid #27272A; padding: 56px 0 36px 0; position: relative;">

        <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube" class="ps-nav-link" style="padding: 10px 14px; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 10px; color: #EF4444 !important; transition: all 0.25s ease;">

        </a>

        <!-- LinkedIn Badge -->
        <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn" class="ps-nav-link" style="padding: 10px 14px; background: rgba(14, 165, 233, 0.08); border: 1px solid rgba(14, 165, 233, 0.2); border-radius: 10px; color: #0EA5E9 !important; transition: all 0.25s ease;">

        <!-- Twitter/X Badge -->
        <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter" class="ps-nav-link" style="padding: 10px 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #FFFFFF !important; transition: all 0.25s ease;">
          <i class="fa-brands fa-x-twitter" style="font-size: 1.1rem; color: #FFFFFF;"></i>
        </a>

        <!-- Facebook Badge -->
        <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook" class="ps-nav-link" style="padding: 10px 14px; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 10px; color: #3B82F6 !important; transition: all 0.25s ease;">
          <i class="fa-brands fa-facebook" style="font-size: 1.1rem; color: #3B82F6;"></i>
        </a>

      </div>

      <!-- Primary Core Nav Links -->
      <div style="display: flex; gap: 20px; font-size: 0.88rem; font-weight: 600;">
        <a href="/reports/index.htm" style="color: #A1A1AA; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#FFFFFF'" onmouseout="this.style.color='#A1A1AA'">Reports</a>

        <a href="/pricing.htm" style="color: #A1A1AA; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#FFFFFF'" onmouseout="this.style.color='#A1A1AA'">Pricing</a>

    </div>

    <!-- Divider Line -->
    <div style="height: 1px; background-color: #18181B; width: 100%; margin-bottom: 24px;"></div>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; font-size: 0.82rem; color: #52525B;">
